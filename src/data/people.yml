# The people shown at /people/. DEMO CONTENT.
#
# The KEY IS THE ANCHOR: `cicero` here is /people/#cicero, and that is what an
# author name in the publication list links to — renaming a key changes a URL.
# `author` points at a row in authors.yml, which holds the name and the ORCID.
# `surnames` is how a name parsed out of papers.bib is matched back to this
# person, so list every form they publish under, including a previous name.

yamori:
  author: yamori
  order: 1
  role: Author
  image: ../assets/people/cicero.png
  surnames: [Yamori]

